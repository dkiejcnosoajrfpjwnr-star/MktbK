name: Telegram Library Bot

on:
  push:
    branches: [main]
  workflow_dispatch:       # تشغيل يدوي من واجهة GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # أقصى مدة للـ job الواحد (GitHub يحد بـ 6 ساعات)

    env:
      BOT_TOKEN:   ${{ secrets.BOT_TOKEN }}
      OWNER_ID:    ${{ secrets.OWNER_ID }}
      API_ID:      ${{ secrets.API_ID }}
      API_HASH:    ${{ secrets.API_HASH }}
      SESSION_STR: ${{ secrets.SESSION_STR }}
      CHANNELS:    ${{ secrets.CHANNELS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Run bot (with auto-restart on crash)
        working-directory: bot
        run: |
          while true; do
            echo "▶️  $(date '+%Y-%m-%d %H:%M:%S') — تشغيل البوت..."
            python main.py
            EXIT_CODE=$?
            echo "⚠️  $(date '+%Y-%m-%d %H:%M:%S') — البوت توقف (exit $EXIT_CODE). إعادة التشغيل خلال 10 ثوانٍ..."
            sleep 10
          done
