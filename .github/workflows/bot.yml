name: Telegram Library Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      BOT_TOKEN:   ${{ secrets.BOT_TOKEN }}
      OWNER_ID:    ${{ secrets.OWNER_ID }}
      API_ID:      ${{ secrets.API_ID }}
      API_HASH:    ${{ secrets.API_HASH }}
      SESSION_STR:   ${{ secrets.SESSION_STR }}
      CHANNELS:      ${{ secrets.CHANNELS }}
      RELAY_CHAT_ID: ${{ secrets.RELAY_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot (with auto-restart on crash)
        run: |
          while true; do
            echo "▶  $(date '+%Y-%m-%d %H:%M:%S') -- Starting bot..."
            python main.py
            EXIT_CODE=$?
            echo "⚠  $(date '+%Y-%m-%d %H:%M:%S') -- Bot stopped (exit $EXIT_CODE). Restarting in 10s..."
            sleep 10
          done
